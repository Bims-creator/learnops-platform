# Demo-only credentials, committed in plaintext for local/portfolio purposes.
# A real deployment would use Sealed Secrets, External Secrets Operator, or a
# cloud secret manager instead of a plain Kubernetes Secret in git.
apiVersion: v1
kind: Secret
metadata:
  name: learnops-secrets
  labels:
    app.kubernetes.io/part-of: learnops
type: Opaque
stringData:
  DATABASE_URL: postgresql://learnops:learnops-dev-only@postgres:5432/learnops
  REDIS_URL: redis://redis:6379/0
  POSTGRES_DB: learnops
  POSTGRES_USER: learnops
  POSTGRES_PASSWORD: learnops-dev-only
