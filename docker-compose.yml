services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: learnops
      POSTGRES_USER: learnops
      POSTGRES_PASSWORD: learnops-dev-only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnops -d learnops"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ingest-api:
    build: ./apps/ingest-api
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://learnops:learnops-dev-only@postgres:5432/learnops
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  aggregator-worker:
    build: ./apps/aggregator-worker
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://learnops:learnops-dev-only@postgres:5432/learnops
    ports:
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
