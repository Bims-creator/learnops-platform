kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: learnops
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 31080
        hostPort: 31080
        protocol: TCP
      - containerPort: 31090
        hostPort: 31090
        protocol: TCP
      - containerPort: 31030
        hostPort: 31030
        protocol: TCP
  - role: worker
  - role: worker
